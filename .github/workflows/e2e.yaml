name: E2E Tests

# Three-tier test model: integration tier. The kind-based controller E2E is heavy
# and needs a cluster, so it runs nightly/manual only — never on pull_request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

jobs:
  e2e:
    name: E2E Controller Tests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make; }

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup kind
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind
          version: v0.20.0
          node_image: kindest/node:v1.29.0
          kubectl_version: v1.29.0

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install CRDs
        run: |
          # Generate CRDs using controller-gen and install them
          make manifests
          for f in config/crd/novastor.io_*.yaml; do
            kubectl apply -f "$f"
          done
          # Verify CRDs are installed
          kubectl get crd | grep novastor

      - name: Create test namespace
        run: |
          kubectl create namespace novastor-e2e-test --dry-run=client
          kubectl create namespace novastor-system --dry-run=client
          kubectl create namespace novastor-e2e-test || true
          kubectl create namespace novastor-system || true

      - name: Run E2E tests
        run: |
          go test -v -tags=e2e -run TestControllerDeployment ./test/e2e/... -timeout 30m
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl get events -n novastor-system || true
          kubectl describe pods -n novastor-system || true
          kubectl get all -n novastor-e2e-test || true
