version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directories:
      - "/dataplane"
      - "/dataplane/nbd"
      - "/dataplane/ndp"
      - "/dataplane/nvmeof-tcp"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - "/build"
      - "/dataplane"
      - "/deploy/docker"
      - "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: helm
    directory: "/deploy/helm/novastor"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      helm-minor-patch:
        update-types: [minor, patch]
